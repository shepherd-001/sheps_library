# Isolated test infrastructure: never connects to the developer database or SMTP server.
spring.datasource.url=jdbc:h2:mem:authorization;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,TRANSACTION
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.database=h2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
mail_from_email=test@example.com
mail_from_name=Test Library
client_url=http://localhost:3000
executor.mail.corePoolSize=1
executor.mail.maxPoolSize=1
executor.mail.queueCapacity=10
jwt_secret_key=test-only-hmac-key-with-at-least-thirty-two-bytes
jwt_access_expiration=900
jwt_refresh_expiration=86400
reset_password_expiration=900
email_confirmation_expiration=900
librarian_invite_expiration=1800
app.seed.admin-enabled=false
app.authorization.verify-catalogue=false
spring.mail.properties.mail.smtp.from=test@example.com
