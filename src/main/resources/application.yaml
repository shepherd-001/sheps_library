server:
  port: ${PORT}

logging:
  level:
    org.springframework.web: INFO

spring:
  application:
    name: ShepsLibrary

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT}
      max-lifetime: ${HIKARI_MAX_LIFETIME}
      minimum-idle: ${HIKARI_MINIMUM_IDLE}

  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          from: ${MAIL_FROM_EMAIL}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  web:
    resources:
      add-mappings: false
#        debug: true

executor:
  mail:
    corePoolSize: ${CORE_POOL_SIZE}
    maxPoolSize: ${MAX_POOL_SIZE}
    queueCapacity: ${QUEUE_CAPACITY}

cache:
  expiry: ${CACHE_EXPIRY}
  maximumSize: ${CACHE_MAXIMUM_SIZE}

admin_email: ${ADMIN_EMAIL}
admin_password: ${ADMIN_PASSWORD}


client_url: ${CLIENT_URL}
mail_from_email: ${MAIL_FROM_EMAIL}
mail_from_name: ${MAIL_FROM_NAME}

brevo_api_key: ${MAILERSEND_API_KEY}

zero_bounce_api_key: ${ZEROBOUNCE_API_KEY}
zero_bounce_url: ${ZEROBOUNCE_URL}
have_i_been_pawned_url: ${HAVE_I_BEEN_PAWNED_URL}

reset_password_expiration: ${RESET_PASSWORD_EXPIRATION}
email_confirmation_expiration: ${EMAIL_CONFIRMATION_EXPIRATION}
librarian_invite_expiration: ${LIBRARIAN_INVITATION_EXPIRATION}

jwt_secret_key: ${JWT_SECRET_KEY}
jwt_access_expiration: ${JWT_EXPIRATION}
jwt_refresh_expiration: ${JWT_REFRESH_EXPIRATION}

app:
  seed:
    roles:
      - ADMIN
      - LIBRARIAN
      - MEMBER
  security:
    allowed-origins:
      - http://localhost:3000
      - https://shep-blog.app

audit:
  enabled: true
  excluded-paths:
    - "/actuator/"
    - "/health"
    - "/swagger"
    - "/static/"
    - "/css/"
  max-body-bytes: 4096
  max-response-bytes: 1024
  capture-body-for-methods:
    - POST
    - PUT
    - PATCH

  queue-capacity: 10000
  batch-size: 200
  flush-interval-ms: 2000
  drop-on-full: false
  retention-days: 90
  consumer-threads: 1
  db-retry-backoff: 2s
  enqueue-offer-timeout-ms: 200
  enable-persistent-fallback: true
  fallback-directory: audit-fallback
  max-write-retries: 5
  consumer-retry-initial-backoff: 1s
  consumer-retry-max-backoff: 30s
  enable-metrics: true
